name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu 镜像已预装 Android SDK（ANDROID_HOME/ANDROID_SDK_ROOT 已设置），
      # 这里只补装本项目需要的 platform 与 build-tools。
      # 不要再套 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已下架 `tools` 包，会直接报 "Failed to find package 'tools'"。
      - name: Install SDK packages
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvTrafficOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
